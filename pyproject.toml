[project]
name = "atlas-rag-engine"
version = "0.1.0"
description = "Agentic, hybrid, graph-aware RAG engine with built-in evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "python-multipart>=0.0.20",
    "defusedxml>=0.7.1",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "aiosqlite>=0.20",
    "pytest-asyncio>=0.24",
    # Used only to generate real PDF/DOCX/PPTX fixtures for the parser tests.
    "fpdf2>=2.8",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]
# Optional OCR for scanned PDFs (also needs the `tesseract` binary on PATH).
ocr = ["pytesseract>=0.3.10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["app*"]
